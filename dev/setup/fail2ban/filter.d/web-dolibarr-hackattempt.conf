# Fail2Ban configuration file
#
# Regexp to detect try to check a couple login/password so we can add mitigation
# on IP making too much tries.

[Definition]

# To test, you can inject this example into log
# echo `date +'%Y-%m-%d %H:%M:%S'`" INFO    1.2.3.4         Hack attempt detected - xxx" >> /mypath/documents/ZionOne.log
#
# then
# fail2ban-client status web-ZionOne-hackattempt
#
# To test rule file on a existing log file
# fail2ban-regex /mypath/documents/ZionOne.log /etc/fail2ban/filter.d/web-ZionOne-hackattempt.conf --print-all-matched

failregex = ^ [A-Z\s]+ <HOST>\s+Hack attempt detected
ignoreregex =
